# Vocabify detekt config — minimal overrides on top of the default ruleset
# (buildUponDefaultConfig = true). Only rules that conflict with the legacy
# upstream codebase or overlap with ktlint are disabled here; everything else
# stays at detekt defaults. Per-module legacy findings are baselined in
# config/detekt/<module>-baseline.xml.

complexity:
  LongMethod:
    active: false # Compose UI code; ktlint + review cover readability
  LongParameterList:
    active: false # DI provider functions and composable params are intentionally long
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    active: false
  ComplexCondition:
    active: false
  NestedBlockDepth:
    active: false

style:
  MagicNumber:
    active: false # UI/layout constants everywhere; not worth annotating
  MaxLineLength:
    active: false # formatting concern — owned by ktlint
  ReturnCount:
    active: false
  UnusedPrivateProperty:
    active: true
    ignoreAnnotated:
      - Preview
      - Rule # JUnit rule properties are referenced only via @get:Rule
  UnusedPrivateFunction:
    active: true
    ignoreAnnotated:
      - Preview
      - Rule
